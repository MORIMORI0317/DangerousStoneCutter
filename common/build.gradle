plugins {
    id 'org.jetbrains.kotlin.jvm'
}
architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}
repositories {
    mavenCentral()
}
kotlin {
    jvmToolchain(21)
}
